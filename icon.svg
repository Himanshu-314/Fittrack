<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>Colorful pencil-sketch fitness app icon</title>
<desc>A blue dumbbell in front of an orange flexed arm, surrounded by energetic orange and yellow pencil strokes.</desc>
<defs>
  <pattern id="scribbleBlue" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
    <path d="M0 2h8M2 6h5" stroke="#a9eaff" stroke-width="1.2" opacity=".65"/>
  </pattern>
  <pattern id="scribbleOrange" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
    <path d="M0 2h8M2 6h5" stroke="#ffe4a1" stroke-width="1.2" opacity=".7"/>
  </pattern>
  <pattern id="scribbleGray" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
    <path d="M0 2h8M2 6h5" stroke="#d7d7d7" stroke-width="1.1" opacity=".7"/>
  </pattern>
</defs>

<!-- Energetic orange swooshes -->
<path d="M43 267 C45 172 124 101 222 72 C160 110 117 165 103 231 C88 260 68 281 43 294Z"
