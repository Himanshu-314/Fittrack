  <path d="M407 187 C438 257 405 345 337 390 C286 423 209 425 151 394"
        fill="none" stroke="#159447" stroke-width="17" stroke-linecap="round"/>
  <path d="M400 194 C428 260 395 338 331 380"
        fill="none" stroke="#76d94b" stroke-width="7" stroke-linecap="round"/>

  <!-- Energy marks -->
  <path d="M390 65 L405 34 L410 76 Z" fill="#ffbf28" stroke="#24211f" stroke-width="6" stroke-linejoin="round"/>
  <path d="M431 111 L463 91 L447 133 Z" fill="#ffbf28" stroke="#24211f" stroke-width="6" stroke-linejoin="round"/>
  <path d="M76 175 L48 160 L83 150 Z" fill="#ffbf28" stroke="#24211f" stroke-width="5" stroke-linejoin="round"/>

