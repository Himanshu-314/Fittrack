<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Fitness app logo — hand-drawn flexed arm</title>
  <desc>Colorful pencil-sketch style flexed arm with green motion ring and yellow energy accents.</desc>
  <defs>
    <pattern id="pencil" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <path d="M0 2 L9 2 M2 7 L7 7" stroke="#fff7e8" stroke-width="1.1" opacity=".55"/>
    </pattern>
    <pattern id="muscleShade" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <path d="M0 1 L11 1 M3 6 L10 6" stroke="#d96f32" stroke-width="1.4" opacity=".5"/>
    </pattern>
  </defs>

  <!-- Open green motion ring -->
  <path d="M105 302 C75 220 120 123 219 91 C279 72 348 88 393 130"
        fill="none" stroke="#159447" stroke-width="17" stroke-linecap="round"/>
  <path d="M109 306 C81 225 126 130 222 99 C278 81 342 95 384 132"
