<path d="M136 440 C225 469 347 447 421 376 C389 423 309 478 214 475Z" fill="url(#scribbleOrange)"/>
<path d="M264 477 C354 459 416 415 453 368" fill="none" stroke="#ffc928" stroke-width="7" stroke-linecap="round"/>

